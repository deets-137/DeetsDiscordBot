<!doctype html>
<html lang="en" data-theme="lilac" data-skin="press" data-surface="midi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DeetsMusic in the call</title>
    <style>
      /* The sign-in card: over the page until the cards mount, and again on a failure.
         Scoped to #gate, so DeetsMusic's look owns everything else. */
      #gate {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: #1e1f22; color: #dbdee1;
        font: 15px/1.5 system-ui, sans-serif;
      }
      #gate[hidden] { display: none; }
      #gate > div { max-width: 32rem; padding: 1.5rem; text-align: center; }
      #gate h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      #gate p { margin: 0.25rem 0; }
      #detail { color: #949ba4; font-size: 0.875rem; }
      /* A phone's notch and home bar (Discord sets these in the frame, ACTIVITY.md §3). */
      body {
        box-sizing: border-box;
        padding: var(--discord-safe-area-inset-top, 0) var(--discord-safe-area-inset-right, 0)
          var(--discord-safe-area-inset-bottom, 0) var(--discord-safe-area-inset-left, 0);
      }
    </style>
  </head>
  <body>
    <main id="gate">
      <div>
        <h1 id="who">Signing in…</h1>
        <p id="status"></p>
        <p id="detail"></p>
      </div>
    </main>
    <script type="module" src="../discord-shell/main.ts"></script>
  </body>
</html>
